plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onesport.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.onesport.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('onesport-release.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'onesport123'
            keyAlias System.getenv("KEY_ALIAS") ?: 'onesport'
            keyPassword System.getenv("KEY_PASSWORD") ?: 'onesport123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
