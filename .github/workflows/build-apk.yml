name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Judul Release (Opsional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: "android-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Web Assets to Android Assets
        run: |
          chmod +x scripts/sync-android-assets.sh
          bash scripts/sync-android-assets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | head -n 1 | awk '{print $2}' | tr -d '"')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}"
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              TAG_NAME="v${VERSION_NAME}-b${{ github.run_number }}"
            fi
          fi
          
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="ONESPORT-${TAG_NAME}.apk"
          
          cp "$APK_SRC" "$APK_DEST"
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONESPORT-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || format('ONESPORT {0}', steps.prepare_apk.outputs.tag_name) }}
          make_latest: true
          body: |
            ## 🏸 ONESPORT Badminton & Mini Soccer Management

            Versi terbaru aplikasi **ONESPORT** telah dirilis otomatis via GitHub Actions!

            ### 📦 Unduh Aplikasi Android (APK):
            Klik file **`${{ steps.prepare_apk.outputs.apk_path }}`** pada bagian **Assets** di bawah untuk mengunduh dan memasang aplikasi di HP Anda.

            ### 📱 Cara Pasang di Android:
            1. Unduh file APK di bawah.
            2. Buka notifikasi download / file manager, lalu pilih **Install**.
            3. Jika muncul izin instalasi dari sumber tidak dikenal (*Install unknown apps*), aktifkan izin tersebut.
            4. Buka aplikasi ONESPORT.

            ---
            _Build: ${{ github.sha }} | Branch: ${{ github.ref_name }}_
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
